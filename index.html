<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: #0f172a;
            overflow: hidden;
        }
        
        #game-board {
            border: 4px solid #4f46e5;
            box-shadow: 0 0 20px #4f46e5, inset 0 0 20px #4f46e5;
            position: relative;
        }
        
        .snake-segment {
            background-color: #10b981;
            box-shadow: 0 0 10px #10b981;
            border-radius: 4px;
            position: absolute;
        }
        
        .food {
            background-color: #ef4444;
            box-shadow: 0 0 15px #ef4444;
            border-radius: 50%;
            position: absolute;
            animation: pulse 0.5s infinite alternate;
        }
        
        @keyframes pulse {
            from { transform: scale(0.9); }
            to { transform: scale(1.1); }
        }
        
        .game-over {
            animation: gameOverGlow 1s infinite alternate;
        }
        
        @keyframes gameOverGlow {
            from { text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #ef4444, 0 0 20px #ef4444; }
            to { text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #ef4444, 0 0 40px #ef4444; }
        }
        
        .control-btn {
            transition: all 0.2s;
            box-shadow: 0 0 5px #4f46e5;
        }
        
        .control-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 10px #4f46e5;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-white">
    <div class="text-center mb-6">
        <h1 class="text-4xl md:text-5xl mb-4 text-transparent bg-clip-text bg-gradient-to-r from-purple-500 to-emerald-400">
            NEON SNAKE
        </h1>
        <div class="flex justify-center gap-8 mb-4">
            <div class="flex items-center gap-2">
                <i class="fas fa-star text-yellow-400"></i>
                <span id="score">0</span>
            </div>
            <div class="flex items-center gap-2">
                <i class="fas fa-trophy text-purple-400"></i>
                <span id="high-score">0</span>
            </div>
        </div>
    </div>
    
    <div class="relative">
        <canvas id="game-board" width="400" height="400" class="bg-gray-900"></canvas>
        
        <div id="start-screen" class="absolute inset-0 flex flex-col items-center justify-center bg-black bg-opacity-80">
            <button id="start-btn" class="px-8 py-3 bg-gradient-to-r from-purple-600 to-blue-500 rounded-full text-xl font-bold mb-4 hover:from-purple-700 hover:to-blue-600 transition-all transform hover:scale-105">
                START GAME
            </button>
            <div class="text-center text-sm text-gray-300">
                <p class="mb-2">Use arrow keys or buttons below</p>
                <p>Eat the red food to grow!</p>
            </div>
        </div>
        
        <div id="game-over-screen" class="absolute inset-0 hidden flex-col items-center justify-center bg-black bg-opacity-80">
            <h2 class="text-3xl game-over mb-4">GAME OVER!</h2>
            <p class="mb-6" id="final-score">Score: 0</p>
            <button id="restart-btn" class="px-8 py-3 bg-gradient-to-r from-red-500 to-pink-500 rounded-full text-xl font-bold mb-4 hover:from-red-600 hover:to-pink-600 transition-all transform hover:scale-105">
                PLAY AGAIN
            </button>
        </div>
    </div>
    
    <div class="mt-6 grid grid-cols-3 gap-2 w-40">
        <div></div>
        <button id="up-btn" class="control-btn bg-gray-800 p-3 rounded-full flex items-center justify-center">
            <i class="fas fa-arrow-up text-xl"></i>
        </button>
        <div></div>
        <button id="left-btn" class="control-btn bg-gray-800 p-3 rounded-full flex items-center justify-center">
            <i class="fas fa-arrow-left text-xl"></i>
        </button>
        <button id="down-btn" class="control-btn bg-gray-800 p-3 rounded-full flex items-center justify-center">
            <i class="fas fa-arrow-down text-xl"></i>
        </button>
        <button id="right-btn" class="control-btn bg-gray-800 p-3 rounded-full flex items-center justify-center">
            <i class="fas fa-arrow-right text-xl"></i>
        </button>
    </div>
    
    <div class="mt-8 text-xs text-gray-400">
        <p>Press SPACE to pause/resume</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('game-board');
            const ctx = canvas.getContext('2d');
            const startScreen = document.getElementById('start-screen');
            const gameOverScreen = document.getElementById('game-over-screen');
            const startBtn = document.getElementById('start-btn');
            const restartBtn = document.getElementById('restart-btn');
            const scoreDisplay = document.getElementById('score');
            const highScoreDisplay = document.getElementById('high-score');
            const finalScoreDisplay = document.getElementById('final-score');
            
            // Control buttons
            const upBtn = document.getElementById('up-btn');
            const downBtn = document.getElementById('down-btn');
            const leftBtn = document.getElementById('left-btn');
            const rightBtn = document.getElementById('right-btn');
            
            // Game settings
            const gridSize = 20;
            const tileCount = canvas.width / gridSize;
            let speed = 7;
            
            // Game state
            let snake = [];
            let food = {};
            let direction = 'right';
            let nextDirection = 'right';
            let score = 0;
            let highScore = localStorage.getItem('snakeHighScore') || 0;
            let gameRunning = false;
            let gamePaused = false;
            let gameLoop;
            
            highScoreDisplay.textContent = highScore;
            
            // Initialize game
            function initGame() {
                snake = [
                    {x: 5, y: 10},
                    {x: 4, y: 10},
                    {x: 3, y: 10}
                ];
                
                direction = 'right';
                nextDirection = 'right';
                score = 0;
                scoreDisplay.textContent = score;
                speed = 7;
                
                placeFood();
                gameRunning = true;
                gamePaused = false;
                
                if (gameLoop) clearInterval(gameLoop);
                gameLoop = setInterval(gameUpdate, 1000 / speed);
            }
            
            // Main game loop
            function gameUpdate() {
                if (gamePaused) return;
                
                direction = nextDirection;
                
                // Move snake
                const head = {x: snake[0].x, y: snake[0].y};
                
                switch(direction) {
                    case 'up':
                        head.y -= 1;
                        break;
                    case 'down':
                        head.y += 1;
                        break;
                    case 'left':
                        head.x -= 1;
                        break;
                    case 'right':
                        head.x += 1;
                        break;
                }
                
                // Check collision with walls
                if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                    gameOver();
                    return;
                }
                
                // Check collision with self
                if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                    gameOver();
                    return;
                }
                
                // Add new head
                snake.unshift(head);
                
                // Check if snake ate food
                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    scoreDisplay.textContent = score;
                    
                    // Increase speed slightly every 50 points
                    if (score % 50 === 0 && speed < 15) {
                        speed += 1;
                        clearInterval(gameLoop);
                        gameLoop = setInterval(gameUpdate, 1000 / speed);
                    }
                    
                    placeFood();
                } else {
                    // Remove tail if no food was eaten
                    snake.pop();
                }
                
                // Clear canvas
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Draw grid
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 0.5;
                
                for (let i = 0; i < tileCount; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * gridSize, 0);
                    ctx.lineTo(i * gridSize, canvas.height);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(0, i * gridSize);
                    ctx.lineTo(canvas.width, i * gridSize);
                    ctx.stroke();
                }
                
                // Draw snake
                snake.forEach((segment, index) => {
                    const intensity = index === 0 ? 1 : 0.7 - (index / snake.length * 0.5);
                    const color = `rgba(16, 185, 129, ${intensity})`;
                    
                    ctx.fillStyle = color;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#10b981';
                    ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize, gridSize);
                    ctx.shadowBlur = 0;
                });
                
                // Draw food
                ctx.fillStyle = '#ef4444';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#ef4444';
                ctx.beginPath();
                ctx.arc(
                    food.x * gridSize + gridSize / 2,
                    food.y * gridSize + gridSize / 2,
                    gridSize / 2,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            
            // Place food randomly
            function placeFood() {
                let validPosition = false;
                
                while (!validPosition) {
                    food = {
                        x: Math.floor(Math.random() * tileCount),
                        y: Math.floor(Math.random() * tileCount)
                    };
                    
                    // Make sure food doesn't appear on snake
                    validPosition = !snake.some(segment => segment.x === food.x && segment.y === food.y);
                }
            }
            
            // Game over
            function gameOver() {
                clearInterval(gameLoop);
                gameRunning = false;
                
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snakeHighScore', highScore);
                    highScoreDisplay.textContent = highScore;
                }
                
                finalScoreDisplay.textContent = `Score: ${score}`;
                gameOverScreen.classList.remove('hidden');
            }
            
            // Toggle pause
            function togglePause() {
                if (!gameRunning) return;
                
                gamePaused = !gamePaused;
                
                if (!gamePaused) {
                    gameLoop = setInterval(gameUpdate, 1000 / speed);
                } else {
                    clearInterval(gameLoop);
                }
            }
            
            // Event listeners
            startBtn.addEventListener('click', () => {
                startScreen.classList.add('hidden');
                initGame();
            });
            
            restartBtn.addEventListener('click', () => {
                gameOverScreen.classList.add('hidden');
                initGame();
            });
            
            document.addEventListener('keydown', (e) => {
                if (!gameRunning) return;
                
                switch(e.key) {
                    case 'ArrowUp':
                        if (direction !== 'down') nextDirection = 'up';
                        break;
                    case 'ArrowDown':
                        if (direction !== 'up') nextDirection = 'down';
                        break;
                    case 'ArrowLeft':
                        if (direction !== 'right') nextDirection = 'left';
                        break;
                    case 'ArrowRight':
                        if (direction !== 'left') nextDirection = 'right';
                        break;
                    case ' ':
                        togglePause();
                        break;
                }
            });
            
            // Touch controls
            upBtn.addEventListener('click', () => {
                if (direction !== 'down') nextDirection = 'up';
            });
            
            downBtn.addEventListener('click', () => {
                if (direction !== 'up') nextDirection = 'down';
            });
            
            leftBtn.addEventListener('click', () => {
                if (direction !== 'right') nextDirection = 'left';
            });
            
            rightBtn.addEventListener('click', () => {
                if (direction !== 'left') nextDirection = 'right';
            });
            
            // Prevent scrolling with arrow keys on mobile
            window.addEventListener('keydown', function(e) {
                if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code) > -1) {
                    e.preventDefault();
                }
            }, false);
        });
    </script>
</body>
</html>
